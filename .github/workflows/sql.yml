name: Verification PostgreSQL 16
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  labs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_PASSWORD: ci-sql-b3-instance-jetable
    steps:
      - uses: actions/checkout@v4
      - name: Executer les TP et le projet sur PostgreSQL 16
        run: bash scripts/run_docker.sh
      - name: Afficher le bilan de verification
        if: always()
        run: python3 scripts/ci_summary.py
